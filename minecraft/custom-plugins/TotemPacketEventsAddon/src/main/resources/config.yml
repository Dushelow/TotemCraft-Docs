# TotemPacketEventsAddon: аддон TotemCraft к PacketEvents. Каждую механику можно выключить отдельно.
# После правки нужен перезапуск сервера.

# Ядро 26.x принимает не больше одного пакета с координатами за тик клиента, второй - кик
# «Invalid move player packet received». Принтер Litematica и похожие моды шлют по нескольку,
# когда поворачивают игрока к блоку. Лишние пакеты превращаются в пакет поворота
# (поворот сохраняется, координаты придут в следующем тике).
one-position-per-tick:
  enabled: true
  # Раз во столько минут писать в журнал, у кого и сколько пакетов исправлено (0 - не писать)
  log-summary-minutes: 10
