name: AutoLock
version: '1.2.0'
main: net.totemcraft.autolock.AutoLock
api-version: '1.21'
depend: [LWC]
description: /autolock - постоянный автоприват сундуков и бочек (защищенный от кражи) по выбору игрока
commands:
  autolock:
    description: Включить или выключить автоприват сундуков и бочек, которые вы ставите
    permission: autolock.use
permissions:
  autolock.use:
    default: true
