# ============================================================================
# TotemWipeBorder - сообщения на границе центра мира (зоны вайпа)
# ============================================================================
# Центр мира не сбрасывается никогда. За его границей территория обновляется
# с выходом новых версий игры, и постройки там будут удалены.
#
# Игрок видит предупреждение (заголовок на экране и строку в чате), когда уходит
# за границу: пешком, на лошади или лодке, телепортом или заходит в игру уже за ней.
# Когда возвращается в центр - видит строку в чате.
# Переход в Незер, Энд и обратно сообщений не даёт (кроме попадания сразу за границу).
#
# Применить изменения без перезапуска сервера:  /wipeborder reload
# Посмотреть, что включено:                     /wipeborder status
# (команды для админов, право totemwipeborder.admin)
#
# Цвета в сообщениях - коды через &: &c красный, &e жёлтый, &7 серый, &f белый, &l жирный.
# Пустая строка '' - это сообщение не показывать.
# ============================================================================

enabled: true

# Миры, где есть граница. Ключ - название папки мира (у нас обычный мир называется 2025).
worlds:
  '2025':
    # Полуразмер квадрата центра: 10000 - это от -10000 до 10000 по X и Z
    radius: 10000

    # true  - квадрат считается от центра границы мира (/worldborder center)
    # false - от точки 0, 0
    use-world-border-center: true

    # Заголовок на экране при выходе за границу
    leave-title: '&c⚠ Внимание! Зона вайпа'

    # Строка в чате при выходе за границу
    leave-message: '&e⚠ Вы покидаете центр мира. &7Дальше 10.000 блоков территория обновляется с выходом новых версий: постройки будут удалены.'

    # Строка в чате при возвращении в центр
    enter-message: '&7Основной мир без вайпов (до 10.000 блоков)'
