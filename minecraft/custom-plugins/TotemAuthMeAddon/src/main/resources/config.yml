# ============================================================================
# TotemAuthMeAddon - аддон TotemCraft к AuthMe
# ============================================================================
# Каждую механику можно выключить (enabled: false). После правки нужен перезапуск сервера.

# ----------------------------------------------------------------------------
# Жемчуг Края в стазис-камерах не пропадает при перезаходе
# ----------------------------------------------------------------------------
# Игра при выходе убирает брошенный жемчуг игрока и при входе возвращает его в мир.
# AuthMe в этот момент (игрок ещё не ввёл пароль) запрещал возврат, и жемчуг пропадал
# или срабатывал сам. Аддон разрешает именно этот возврат. Бросать жемчуг до ввода
# пароля по-прежнему нельзя.
keep-ender-pearls-on-join:
  enabled: true

  # true - писать в журнал сервера каждый возвращённый жемчуг (кто и где)
  log: true
