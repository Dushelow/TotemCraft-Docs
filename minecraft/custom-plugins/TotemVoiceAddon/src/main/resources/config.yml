# TotemVoiceAddon - голос ботов TotemBots в Plasmo Voice.
# Бот присылает свою речь (программа TotemBots на компьютере владельца), аддон проигрывает её у бота:
# игроки рядом слышат бота, как обычного игрока с микрофоном. У игроков в Plasmo Voice - своя громкость «Боты».

# Голос любого бота программы TotemBots (она сама подписывается на канал totem:ears при входе) - без списка ников.
# false - только ники из списка bots.
any-totembots: true

# Ники ботов (дополнительно к любому TotemBots или вместо, если any-totembots: false)
bots:
  - Alex

# На сколько блоков слышно бота
distance: 24

# Уши ботов: речь игроков в Plasmo Voice рядом с ботом (в distance блоков) уходит боту после конца фразы,
# программа TotemBots распознаёт её в текст. Свою речь боты не слышат.
ears:
  enabled: true
  distance: 24

# Писать в журнал сервера каждую фразу бота (длина и сколько игроков её слышат)
log: true
