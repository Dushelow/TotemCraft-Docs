# TotemSimpleClansAddon: аддон TotemCraft к SimpleClans. Каждую механику можно выключить отдельно.
# После правки нужен перезапуск сервера.

# Тег клана перед ником в чате видят только игроки в кланах и те, у кого есть право see-permission.
# Для остальных строка чата без тега. Консоль и журнал сервера видят тег всегда.
clan-tags:
  enabled: true
  # Право видеть теги, даже не состоя в клане (называется как у прежнего плагина ClanTagView,
  # в LuckPerms оно уже выдано)
  see-permission: clantagview.see
  # Если строка чата начинается с одной из этих приставок, тег ставится сразу после неё:
  # "[Рядом] TAG.<Ник> текст", а не "TAG.[Рядом] <Ник> текст". Текст как в chatTypeLocal Essentials.
  tag-after-prefixes:
    - '[Рядом] '
