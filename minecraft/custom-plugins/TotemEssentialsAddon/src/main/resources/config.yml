# TotemEssentialsAddon: аддон TotemCraft к EssentialsChat. Каждую механику можно выключить отдельно.
# После правки нужен перезапуск сервера. Цвета: коды через &.
# Радиус, формат и приставку "[Рядом]" ближнего чата задаёт сам Essentials (chat.radius, chatTypeLocal).

# Ближний чат: "!текст" и "/l текст" - одно сообщение рядом, "/g текст" - одно сообщение всем,
# "/l" и "/g" без текста переключают режим. По умолчанию все пишут в общий (shout-default в Essentials).
local-chat:
  enabled: true
  # Первый символ сообщения, который делает его ближним
  prefix: '!'
  messages:
    mode-local: '&7Чат: &fрядом&7, сообщения видят игроки в {radius} блоках. Одно сообщение всем: &f/g текст&7, вернуть общий чат: &f/g'
    already-local: '&7Вы уже пишете рядом. Вернуть общий чат: &f/g'
    mode-global: '&7Чат: &fобщий&7. Сообщение рядом: &f!текст&7 или &f/l текст'
    already-global: '&7Вы уже пишете всем. Сообщение рядом: &f!текст&7 или &f/l текст'
    # /l занята в AuthMe как /login: после входа слово, совпадающее с паролем, в чат не уходит
    password-not-sent: '&cВы уже вошли на сервер. Сообщение не отправлено: это ваш пароль.'
    no-slash: '&cСообщение не может начинаться с /'
    only-players: 'Команда только для игроков'

# Ближнее сообщение никто не услышал: пишем об этом, но не чаще раза в cooldown-seconds.
# Наблюдатели и невидимые админы слушателями не считаются.
# В Essentials текст localNoOne должен быть пустым, иначе строка придёт ещё и от него.
no-one-nearby:
  enabled: true
  cooldown-seconds: 30
  message: '&7Рядом никого нет'

# Ближние сообщения не пересылаются в Discord (нужен DiscordSRV, без него пропускается)
discord-filter:
  enabled: true

# Строка слежки за ближним чатом без лишнего "</gray>" после ника
spy-format-fix:
  enabled: true

messages:
  feature-disabled: '&cЭта функция выключена.'
