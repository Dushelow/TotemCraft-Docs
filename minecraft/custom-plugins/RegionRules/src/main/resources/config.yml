# Свои правила для регионов WorldGuard (названия регионов, любой мир).
# После правки нужен перезапуск сервера.

# Огненные шары (всполохи, гасты, заряды из раздатчиков) не поджигают блоки.
# Урон и поджог игроков и мобов остаются.
no-fireball-fire:
  - spawn_zone_castle

# Эти мобы не получают урон от шипов на броне игроков.
no-thorns-damage:
  regions:
    - spawn_zone_castle
  mobs:
    - blaze

# true: писать в журнал каждую отмену, для проверки
debug: false
