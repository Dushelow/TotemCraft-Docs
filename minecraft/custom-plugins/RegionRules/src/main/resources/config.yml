# Свои правила для регионов WorldGuard (названия регионов, любой мир).
# После правки нужен перезапуск сервера.

# Огненные шары (всполохи, гасты, заряды из раздатчиков) не поджигают блоки.
# Урон и поджог игроков и мобов остаются.
no-fireball-fire:
  - spawn_zone_castle

# Эти мобы не получают урон от шипов на броне игроков.
no-thorns-damage:
  regions:
    - spawn_zone_castle
  mobs:
    - blaze

# true: писать в журнал каждую отмену, для проверки
debug: false

# Граница зоны вайпа: сообщения, когда игрок пересекает квадрат ±radius в этом мире
# (пешком, на транспорте, телепортом). Переход в другой мир сообщения не даёт.
# Ключ - название мира. Пустая строка - не показывать.
wipe-border:
  '2025':
    radius: 10000
    leave-title: '§c⚠ Внимание! Зона вайпа'
    leave-message: '§e⚠ Вы покидаете центр мира. §7Дальше 10.000 блоков территория обновляется с выходом новых версий: постройки будут удалены.'
    enter-message: '§7Основной мир без вайпов (до 10.000 блоков)'
