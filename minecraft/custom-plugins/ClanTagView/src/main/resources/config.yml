# ClanTagView: тег клана в чате видят только игроки в кланах и право clantagview.see.
# Если строка чата начинается с одной из этих приставок, тег ставится сразу после неё:
# "[Рядом] TAG.<Ник> текст", а не "TAG.[Рядом] <Ник> текст". Текст как в chatTypeLocal Essentials.
tag-after-prefixes:
  - '[Рядом] '

# Ближний чат: если сообщение никто не получил, пишем «Рядом никого нет», но не чаще раза в столько секунд.
# В Essentials текст localNoOne пустой, иначе строка шла бы ещё и от него, без задержки.
local-no-one-cooldown-seconds: 30
