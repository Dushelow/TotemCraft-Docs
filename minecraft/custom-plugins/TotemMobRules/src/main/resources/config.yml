# ============================================================================
# TotemMobRules - правила поведения мобов на TotemCraft
# ============================================================================
# Здесь четыре механики. Каждая включается и выключается отдельно (enabled: true/false).
#
# Применить изменения без перезапуска сервера:  /mobrules reload
# Посмотреть, что включено и сколько сработало: /mobrules status
# (команды для админов, право totemrules.admin)
#
# --- Как писать мобов ---
# Названия как в игре на английском, через подчёркивание, регистр не важен:
#   blaze (всполох), ghast (гаст), villager (житель), iron_golem (железный голем),
#   creeper (крипер), wither (визер), zombie, skeleton, wandering_trader ...
# Ошибку в названии плагин покажет в журнале сервера при запуске.
#
# --- Где действует правило (where) ---
#   where: {}                       - везде, во всех мирах
#   where:
#     worlds: [2025_nether]         - только в этих мирах (названия папок миров)
#     regions: [spawn_zone_castle]  - только внутри этих регионов WorldGuard
# Если указаны и миры, и регионы, должны совпасть оба условия.
# Опечатку в названии региона плагин покажет в журнале сервера при запуске.
# ============================================================================


# ----------------------------------------------------------------------------
# 1. Временный огонь от мобов
# ----------------------------------------------------------------------------
# Огонь, который поставили мобы из sources (огненным шаром или взрывом своего шара),
# горит как обычно: игрок в нём горит и получает урон. Но через burn-seconds огонь
# гаснет сам, и постройки не сгорают.
# Огонь от игроков (зажигалка, огненный заряд), лавы и молнии НЕ трогается.
temporary-fire:
  enabled: true

  # Чей огонь делать временным
  sources:
    - blaze
    - ghast

  # Через сколько секунд огонь гаснет сам
  burn-seconds: 60

  # false - блок под огнём не сгорает (деревянные постройки целы)
  # true  - сгорает как обычно
  burn-blocks: false

  # false - огонь не перекидывается на соседние блоки
  # true  - распространяется как обычно
  spread: false

  # Где действует (пусто - везде)
  where: {}


# ----------------------------------------------------------------------------
# 2. Взрывы мобов не ломают блоки
# ----------------------------------------------------------------------------
# Взрывы мобов из mobs (сам моб или его снаряд, например шар гаста) не разрушают блоки.
# Урон игрокам и мобам от взрыва остаётся. Огонь от взрыва - по правилам temporary-fire.
no-block-damage-explosions:
  enabled: true

  mobs:
    - ghast

  # Где действует (пусто - везде)
  where: {}


# ----------------------------------------------------------------------------
# 3. Правила урона
# ----------------------------------------------------------------------------
# Список правил. Каждое правило говорит: «существа victims не получают урон
# от мобов from-mobs или от причин from-causes вот здесь (where)».
# Достаточно, чтобы совпал моб ИЛИ причина. От мобов из from-mobs защищённые
# ещё и не загораются.
#
# from-mobs - кто бьёт: моб сам (удар), его снаряд (шар, стрела) или взрыв его снаряда.
# from-causes - от чего урон. Самые нужные:
#   thorns    - шипы на броне          fire      - стоит в огне
#   fire_tick - горит после огня       lava      - лава
#   fall      - падение                drowning  - утопление
#   projectile, entity_attack, block_explosion, entity_explosion, magic, poison
# Название правила (например villagers-in-castle) - любое, оно видно в /mobrules status.
# Чтобы временно выключить одно правило, добавьте в него: enabled: false
damage-rules:

  # Стражи-всполохи и гасты не убивают жителей в замке, жители не горят в огне в замке
  villagers-in-castle:
    victims:
      - villager
    from-mobs:
      - blaze
      - ghast
    from-causes:
      - fire
      - fire_tick
    where:
      regions:
        - spawn_zone_castle

  # Всполохи в замке не умирают от шипов на броне игроков
  blazes-no-thorns:
    victims:
      - blaze
    from-causes:
      - thorns
    where:
      regions:
        - spawn_zone_castle

  # Пример: железные големы на всей карте не получают урон от криперов (выключено)
  # golems-vs-creepers:
  #   enabled: false
  #   victims: [iron_golem]
  #   from-mobs: [creeper]
  #   where: {}


# ----------------------------------------------------------------------------
# 4. Мирные мобы для выбранных игроков
# ----------------------------------------------------------------------------
# Мобы из mobs в месте where не трогают игроков из списка правила: не выбирают их целью,
# не наносят урон (удар, снаряд, взрыв снаряда) и не поджигают. Остальных бьют как обычно.
#
# Сам список игроков здесь не пишется, он меняется командами (хранится в peaceful-players.yml):
#   /mobrules peace list                       - все правила и кто в списках
#   /mobrules peace add castle-guards <ник>    - добавить игрока
#   /mobrules peace remove castle-guards <ник> - убрать игрока
# Менять список могут админы (право totemrules.admin), а если region-owners-can-edit: true -
# ещё и владельцы регионов, указанных в where этого правила.
# Чтобы временно выключить одно правило, добавьте в него: enabled: false
peaceful-mobs:

  # Стражи-всполохи в замке не трогают своих
  castle-guards:
    mobs:
      - blaze
    where:
      regions:
        - spawn_zone_castle
    region-owners-can-edit: true


# true - писать в журнал сервера каждый поджог от мобов (для проверки, обычно false)
debug: false
