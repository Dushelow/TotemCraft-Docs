name: TotemMobRules
version: '${project.version}'
main: net.totemcraft.mobrules.TotemMobRules
api-version: '1.21'
# WorldGuard нужен только правилам с регионами в where; без него плагин работает,
# а правила с регионами не срабатывают (предупреждение в журнале)
softdepend: [WorldGuard]
authors: [TotemCraft]
website: https://totemcraft.net
description: Правила поведения мобов TotemCraft - временный огонь от мобов, взрывы без разрушений, правила урона
commands:
  mobrules:
    description: Правила мобов - /mobrules status|reload (админы), /mobrules peace list|add|remove (админы и владельцы регионов)
    usage: /mobrules [status|reload|peace]
    aliases: [totemmobrules, totemrules]
permissions:
  totemrules.admin:
    description: /mobrules status и reload, правка любых списков peace
    default: op
