# TotemWorldGuardAddon: аддон TotemCraft к WorldGuard, правила регионов, которых нет среди его флагов.
# Каждую механику можно выключить отдельно. Регионы - названия регионов WorldGuard (в любом мире).
# После правки нужен перезапуск сервера. Цвета: коды через &.

# Огонь от огненных шаров этих мобов (sources) временный: горит как обычно, игрок в нём горит и
# получает урон, но через burn-seconds гаснет сам. burn-blocks: false - блоки под ним не сгорают,
# spread: false - дальше не распространяется. Огонь от зажигалки, лавы и молнии не трогается.
# regions пустой - на всей карте.
temporary-fireball-fire:
  enabled: true
  sources:
    - blaze
    - ghast
  burn-seconds: 60
  burn-blocks: false
  spread: false
  regions: []

# Мобы из victims в регионах не получают урон от мобов из attackers (удар, огненный шар) и не
# загораются от них. fire-damage: true - ещё не горят в огне внутри региона. Игроков не касается.
# regions пустой - на всей карте. Названия мобов как в Paper (villager, iron_golem, blaze...).
protected-mobs:
  enabled: true
  victims:
    - villager
  attackers:
    - blaze
    - ghast
  fire-damage: true
  regions:
    - spawn_zone_castle

# Эти мобы не получают урон от шипов на броне игроков (названия мобов Paper).
no-thorns-damage:
  enabled: true
  regions:
    - spawn_zone_castle
  mobs:
    - blaze

# Граница центра мира (зоны вайпа): сообщения, когда игрок пересекает квадрат ±radius в этом мире
# (пешком, на транспорте, телепортом). Переход в другой мир сообщения не даёт, кроме попадания
# сразу за границу. Ключ - название мира. Пустая строка - не показывать.
wipe-border:
  enabled: true
  worlds:
    '2025':
      radius: 10000
      leave-title: '&c⚠ Внимание! Зона вайпа'
      leave-message: '&e⚠ Вы покидаете центр мира. &7Дальше 10.000 блоков территория обновляется с выходом новых версий: постройки будут удалены.'
      enter-message: '&7Основной мир без вайпов (до 10.000 блоков)'

# true: писать в журнал каждую отмену поджога и урон по мобам из no-thorns-damage в регионах
debug: false
