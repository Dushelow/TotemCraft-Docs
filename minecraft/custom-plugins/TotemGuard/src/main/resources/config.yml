# TotemGuard: наказание по экспериментальным проверкам Vulcan.
# Vulcan сам по таким проверкам не наказывает. Ключ правила: "проверка:тип" как в журнале Vulcan.
# Порог подбирается по журналу violations.txt: заметно выше максимума у честных игроков.
bypass-permission: totemguard.bypass

rules:
  # Speed E (неправильное трение): моды на полёт на элитрах и прыжки по стенам.
  # 07.11.2026: у честных игроков максимум VL 128, у игрока с читерскими модами 2186.
  speed:e:
    vl: 500
    command: 'ban %player% AntiCheat'
